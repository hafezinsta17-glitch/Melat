name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: ${JAVA_MAJOR}"
          
          if [ -z "${JAVA_MAJOR}" ]; then
            echo "ERROR: Unable to detect Java version."
            exit 1
          fi
          
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "ERROR: Java 17 or higher is required. Found version: ${JAVA_MAJOR}"
            exit 1
          fi
          
          echo "Java environment verified successfully (version >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi
          
          echo "debug.keystore verified in root directory."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${TARGET_APK}" ]; then
            echo "ERROR: Target APK ${TARGET_APK} was not found!"
            echo "Searching app/build/outputs/apk for any generated APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "${TARGET_APK}" ]; then
            echo "ERROR: Target APK ${TARGET_APK} exists but is empty."
            exit 1
          fi
          
          case "${TARGET_APK}" in
            *.apk) ;;
            *) echo "ERROR: Target file does not have .apk extension."; exit 1 ;;
          esac
          
          echo "Verified APK at: ${TARGET_APK} (Size: $(stat -c%s "${TARGET_APK}") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${{ runner.temp }}/release_asset"
          mkdir -p "${ASSET_DIR}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${ASSET_DIR}/app-debug.apk"
          
          if [ ! -s "${ASSET_DIR}/app-debug.apk" ]; then
            echo "ERROR: Failed to prepare ${ASSET_DIR}/app-debug.apk"
            exit 1
          fi
          
          echo "asset_path=${ASSET_DIR}/app-debug.apk" >> $GITHUB_OUTPUT
          echo "Prepared release asset: ${ASSET_DIR}/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Verification ==="
          gh --version
          
          RELEASE_ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "${RELEASE_ASSET}" ] || [ ! -s "${RELEASE_ASSET}" ]; then
            echo "ERROR: Release asset ${RELEASE_ASSET} is missing or empty."
            exit 1
          fi
          
          FILENAME=$(basename "${RELEASE_ASSET}")
          if [ "${FILENAME}" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be app-debug.apk, got: ${FILENAME}"
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES="### Automated Debug Build
          - **Build System:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** \`${{ github.sha }}\`
          - **Build Type:** Debug APK (testing only, not for Google Play production)
          - **Signing:** Temporary debug keystore"
          
          echo "Creating release with tag: ${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" \
            "${RELEASE_ASSET}" \
            --target "${{ github.sha }}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Build & Release Summary ==="
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "GitHub Release published successfully."
            gh release view "${RELEASE_TAG}" || true
            
            DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
            echo "DIRECT APK DOWNLOAD URL: ${DIRECT_URL}"
            
            echo "### DIRECT APK DOWNLOAD" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[Download app-debug.apk](${DIRECT_URL})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Filename:** \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Link:** \`${DIRECT_URL}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Actions Backup Artifact:** The workflow artifact \`app-debug-apk\` is also preserved as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: Release publishing failed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully."
              echo "The GitHub Actions artifact 'app-debug-apk' remains available as a backup."
            fi
          fi
